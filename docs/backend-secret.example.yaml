# Reference template only — NOT a live manifest, and deliberately kept
# OUTSIDE manifests/ so Argo CD (which syncs everything under manifests/)
# never applies this to the cluster.
#
# To set up the real Secret: copy this to manifests/backend-secret.yaml
# (gitignored) and replace the placeholder values, then:
#   kubectl apply -f manifests/backend-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: taskapp
type: Opaque
stringData:
  DATABASE_USER: "REPLACE_ME_locally_never_commit"
  DATABASE_PASSWORD: "REPLACE_ME_locally_never_commit"
  SECRET_KEY: "REPLACE_ME_locally_never_commit"