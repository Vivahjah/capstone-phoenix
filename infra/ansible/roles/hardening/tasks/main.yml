---
- name: Disable root login
  lineinfile:
    path: /etc/ssh/sshd_config
    line: "PermitRootLogin no"
    state: present
  notify: Restart SSH Service

- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: true

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"

- name: Allow HTTP
  ufw:
    rule: allow
    port: "80"

- name: Allow HTTPS
  ufw:
    rule: allow
    port: "443"

- name: Allow internal subnet
  ufw:
    rule: allow
    src: "{{ cluster_subnet_cidr }}"

- name: Allow k3s API server (kubectl + worker registration)
  ufw:
    rule: allow
    port: "6443"

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny