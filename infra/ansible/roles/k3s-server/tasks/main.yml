---
- name: Install the k3s server on the control-plane
  ansible.builtin.shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_EXEC="server --flannel-backend=none --cluster-init --tls-san={{ ansible_host }}"
    sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: result
  until: result.rc == 0
  retries: 10
  delay: 10
  changed_when: false