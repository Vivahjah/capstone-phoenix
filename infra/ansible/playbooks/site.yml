
- name: SSH and firewall hardening on all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - hardening
  tags: hardening

- name: Install and start k3s server on control plane
  hosts: server
  become: true
  roles:
    - k3s-server
  tags: k3s-server

- name: Join worker nodes to the cluster
  hosts: agents
  become: true
  roles:
    - k3s-agent
  tags: k3s-agent

- name: Fetch kubeconfig to local machine
  hosts: server
  become: true
  roles:
    - kubeconfig
  tags: kubeconfig